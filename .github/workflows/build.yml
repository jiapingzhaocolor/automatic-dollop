name: Build OpenFX bundles

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: FilmGrainOFX-windows-x64
          - name: macOS Universal
            os: macos-15
            artifact: FilmGrainOFX-macos-universal
          - name: Linux x86_64
            os: ubuntu-24.04
            artifact: FilmGrainOFX-linux-x86_64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON '-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64'

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --build build --parallel

      - name: Test core and OFX lifecycle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Test core and OFX lifecycle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ctest --test-dir build --output-on-failure

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/dist/FilmGrainOFX.ofx.bundle -DestinationPath FilmGrainOFX-windows-x64.zip -Force

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/dist/FilmGrainOFX.ofx.bundle FilmGrainOFX-macos-universal.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd build/dist
          zip -r ../../FilmGrainOFX-linux-x86_64.zip FilmGrainOFX.ofx.bundle

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error
          compression-level: 0
